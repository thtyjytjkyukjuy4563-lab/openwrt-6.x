      - name: Compile IPQ-WIFI Package Only
        run: |
          export TERM=linux
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 直接编译包，不生成整个目标的 config
          # 如果缺少 .config，make 通常会尝试创建一个最小的默认 config
          # 为了防止交互提示，我们再次使用 yes
          yes '' | make package/firmware/ipq-wifi/compile V=s
